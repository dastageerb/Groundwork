            "description": "Unavailable or capacity exhausted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [],
        "parameters": [
          {
            "name": "verify",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "1"
              ]
            },
            "description": "Administrator-only company connection. Validates the provider, links the provider identity to the current administrator without transferring existing identities, and activates managed company-only login. Preserves the current session. Environment-managed settings only validate the connection."
          }
        ],
        "description": "Starts state/nonce/PKCE-protected login with the current configuration revision. Normal first sign-in provisions a member. verify=1 requires a permanent administrator session and can connect pending settings. After managed activation, local login is disabled at session issuance as well as in the UI."
      }
    },
