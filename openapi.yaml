      "put": {
        "summary": "Save one Google Workspace or Microsoft 365 provider",
        "description": "Administrator only; exact Origin required. Stores encrypted write-only credentials. First save remains pending until an administrator company connection succeeds. Editing an active configuration preserves company-only mode. Invalidates pending OIDC states and resets lastLoginAt. Environment OIDC settings cannot be edited here.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "revision": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "provider": {
                    "type": "string",
                    "enum": [
                      "google",
                      "microsoft"
                    ]
                  },
                  "clientId": {
                    "type": "string",
                    "maxLength": 512
                  },
                  "clientSecret": {
                    "type": "string",
                    "maxLength": 4096,
                    "writeOnly": true,
                    "description": "Required for a new client. Omit to retain an existing secret for the same provider/client/tenant."
                  },
                  "domain": {
                    "type": "string",
                    "description": "Required for Google Workspace. Exact signed hd claim."
                  },
                  "tenantId": {
                    "type": "string",
                    "format": "uuid",
                    "description": "Required for Microsoft; use a single tenant registration."
                  }
                },
                "required": [
                  "revision",
                  "provider",
                  "clientId"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Settings metadata only; no client secret.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CompanySignIn"
                }
              }
            }
          },
          "401": {
            "description": "Sign-in required"
          },
          "403": {
            "description": "Permanent administrator account required"
          },
          "409": {
            "description": "Stale configuration revision, server-managed settings, or no local recovery admin on disconnect"
          },
          "422": {
            "description": "Invalid provider configuration"
          }
        }
      },
      "delete": {
        "summary": "Disconnect the managed company provider",
        "description": "Administrator only; exact Origin and current revision required. Requires a permanent local administrator. Deletes credentials and pending OIDC states. Preserves users and existing sessions. Restores local login.",
